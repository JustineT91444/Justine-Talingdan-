<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<link rel="stylesheet" href="./css/style.css">
<script src="js/cal.js" defer></script>

</head>

<body>

<div class="calculator">
    <h2>Calculator</h2>

    <!-- Display row: 3 width display, 1 width operator -->
    <div class="display-container">
        <div id="display" class="display">0</div>
        <div id="operatorBox" class="operator-box"></div>
    </div>

    <div class="buttons">
        <!-- Top row -->
        <button class="clear wide" onclick="allClear()">AC</button>
        <button class="clear" onclick="clearEntry()">C</button>
        <button class="operator" onclick="setOperator('+')">+</button>

        <!-- Second row -->
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="setOperator('-')">−</button>

        <!-- Third row -->
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="setOperator('*')">×</button>

        <!-- Fourth row -->
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="setOperator('/')">÷</button>

        <!-- Fifth row -->
        <button onclick="appendNumber('0')">0</button>
        <button onclick="appendNumber('.')">.</button>
        <button class="equals wide" onclick="calculate()">=</button>
    </div>
</div>

</body>
</html>
