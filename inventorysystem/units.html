<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Units - Inventory System</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span>📦</span>
            <h5>Inventory</h5>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M4 6l2-2h12l2 2M10 10v4M14 10v4"/></g></svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="items.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></g></svg>
                    <span>Items</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="categories.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M12 3H7a2 2 0 0 0-2 2v3m0 0l3-3 3 3M5 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/></svg>
                    <span>Categories</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="units.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2m0 0v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7"/></svg>
                    <span>Units</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-bottom">
            <a class="logout-btn" href="login.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"/></svg>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="breadcrumb-nav">
                <a href="dashboard.html">Home</a>
                <span>/</span>
                <span>Units</span>
            </div>
            <div class="profile-dropdown">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div>
                    <div style="font-size: 0.875rem; font-weight: 600;" id="profileName">User</div>
                </div>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <h1>Units of Measurement</h1>
            <p style="color: var(--text-secondary); margin: 0;">Define units of measurement for your items (e.g., kg, pcs, box).</p>
        </div>

        <!-- Page Content -->
        <div style="padding: 0 var(--spacing-xl) var(--spacing-xl);">
            <!-- Search and Action Bar -->
            <div style="display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-lg);">
                <div class="search-bar" style="flex: 1;">
                    <input type="text" id="searchUnits" class="form-control" placeholder="Search units...">
                </div>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUnitModal">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    Add
                </button>
            </div>

            <!-- Units Table -->
            <div class="card">
                <div class="table-responsive">
                    <table class="table" id="unitsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Unit</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="unitsTableBody">
                            <tr>
                                <td colspan="3" class="empty-state">
                                    <div class="empty-state-icon">⚖️</div>
                                    <div class="empty-state-title">No units yet</div>
                                    <p style="margin: 0;">Click "Add" to create your first unit of measurement</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Unit Modal -->
    <div class="modal fade" id="addUnitModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Unit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addUnitForm" onsubmit="handleAddUnit(event)">
                        <div class="form-group mb-3">
                            <label for="unitName" class="form-label">Unit Name</label>
                            <input type="text" class="form-control" id="unitName" placeholder="e.g., Kilogram, Piece, Box" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Add Unit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        let units = [];
        let nextId = 1;
        let editingUnitId = null;

        document.addEventListener('DOMContentLoaded', function() {
            const username = localStorage.getItem('username') || 'User';
            const firstLetter = username.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = username;
            document.getElementById('profileAvatar').textContent = firstLetter;

            loadUnits();
            const searchEl = document.getElementById('searchUnits');
            if (searchEl) {
                searchEl.addEventListener('input', e => filterTableDebounced(e.target.value));
            }
        });

        function handleAddUnit(e) {
            e.preventDefault();
            const name = document.getElementById('unitName').value;

            if (editingUnitId !== null) {
                const idx = units.findIndex(u => u.id === editingUnitId);
                if (idx !== -1) {
                    units[idx].name = name;
                    saveUnits();
                    renderUnits();
                    addActivity('unit-updated', `Updated unit \"${name}\"`);
                    showToast('Unit updated successfully!', 'success');
                }
                editingUnitId = null;
            } else {
                const unit = {
                    id: nextId++,
                    name
                };
                units.push(unit);
                saveUnits();
                renderUnits();
                addActivity('unit-added', `Added unit \"${name}\"`);
                showToast('Unit added successfully!', 'success');
            }

            document.getElementById('addUnitForm').reset();
            const modal = bootstrap.Modal.getInstance(document.getElementById('addUnitModal'));
            modal.hide();
            document.querySelector('#addUnitModal .modal-title').textContent = 'Add New Unit';
            document.querySelector('#addUnitForm button[type="submit"]').textContent = 'Add Unit';
        }

        const filterTableDebounced = debounce(filterTable, 250);
        function filterTable(searchTerm) {
            const filtered = units.filter(unit => 
                unit.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                unit.id.toString().includes(searchTerm)
            );
            renderUnits(filtered);
        }

        function renderUnits(unitsToShow = units) {
            const tbody = document.getElementById('unitsTableBody');
            
            if (unitsToShow.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="3" class="empty-state">
                            <div class="empty-state-icon">⚖️</div>
                            <div class="empty-state-title">No units yet</div>
                            <p style="margin: 0;">Click "Add" to create your first unit of measurement</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = unitsToShow.map(unit => `
                <tr class="flash-new">
                    <td>${unit.id}</td>
                    <td>${unit.name}</td>
                    <td style="display: flex; gap: var(--spacing-sm);">
                        <button class="btn btn-sm btn-warning" onclick="editUnit(${unit.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUnit(${unit.id})">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function editUnit(id) {
            const u = units.find(u => u.id === id);
            if (!u) return;
            editingUnitId = id;
            document.getElementById('unitName').value = u.name;
            const modal = new bootstrap.Modal(document.getElementById('addUnitModal'));
            document.querySelector('#addUnitModal .modal-title').textContent = 'Edit Unit';
            document.querySelector('#addUnitForm button[type="submit"]').textContent = 'Save Changes';
            modal.show();
        }

        function deleteUnit(id) {
            const toDel = units.find(u => u.id === id);
            // don't allow deletion if items use this unit
            const items = JSON.parse(localStorage.getItem('items') || '[]');
            const inUse = items.filter(i => i.unitId === id);
            if (inUse.length > 0) {
                alert(`Cannot delete unit; ${inUse.length} item(s) are using it.`);
                return;
            }
            if (confirm('Are you sure you want to delete this unit?')) {
                units = units.filter(unit => unit.id !== id);
                saveUnits();
                renderUnits();
                addActivity('unit-deleted', `Deleted unit \"${toDel ? toDel.name : id}\"`);
                showToast('Unit deleted successfully!', 'success');
            }
        }

        function saveUnits() {
            localStorage.setItem('units', JSON.stringify(units));
        }

        function loadUnits() {
            const saved = localStorage.getItem('units');
            if (saved) {
                units = JSON.parse(saved);
                nextId = Math.max(...units.map(u => u.id), 0) + 1;
                renderUnits();
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
