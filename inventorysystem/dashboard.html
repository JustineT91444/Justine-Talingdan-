<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Inventory System</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-brand">
            <span>📦</span>
            <h5>Inventory</h5>
        </div>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="dashboard.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6z"/><path d="M4 6l2-2h12l2 2M10 10v4M14 10v4"/></g></svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="items.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></g></svg>
                    <span>Items</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="categories.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M12 3H7a2 2 0 0 0-2 2v3m0 0l3-3 3 3M5 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/></svg>
                    <span>Categories</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="units.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2m0 0v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7"/></svg>
                    <span>Units</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-bottom">
            <a class="logout-btn" href="login.html">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v1"/></svg>
                <span>Logout</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="breadcrumb-nav">
                <a href="dashboard.html">Home</a>
                <span>/</span>
                <span>Dashboard</span>
            </div>
            <div class="profile-dropdown">
                <div class="profile-avatar" id="profileAvatar">U</div>
                <div>
                    <div style="font-size: 0.875rem; font-weight: 600;" id="profileName">User</div>
                </div>
            </div>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <h1>Dashboard</h1>
            <p style="color: var(--text-secondary); margin: 0;">Welcome back! Here's an overview of your inventory.</p>
        </div>

        <!-- Page Content -->
        <div style="padding: 0 var(--spacing-xl) var(--spacing-xl);">
            <!-- Metric Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="card metric-card metric-total">
                        <div class="card-body">
                            <div class="metric-card-icon">📊</div>
                            <div class="metric-card-label">Total Items</div>
                            <div class="metric-card-value">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card metric-card metric-low-qty">
                        <div class="card-body">
                            <div class="metric-card-icon">⚠️</div>
                            <div class="metric-card-label">Low Quantity</div>
                            <div class="metric-card-value">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card metric-card metric-empty-stock">
                        <div class="card-body">
                            <div class="metric-card-icon">❌</div>
                            <div class="metric-card-label">Out of Stock</div>
                            <div class="metric-card-value">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h5 style="margin: 0;">Recent Activity</h5>
                </div>
                <div class="card-body">
                    <!-- dynamic activity timeline will be injected here -->
                    <div id="activityTimeline"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Load user profile
        document.addEventListener('DOMContentLoaded', function() {
            const username = localStorage.getItem('username') || 'User';
            const firstLetter = username.charAt(0).toUpperCase();
            document.getElementById('profileName').textContent = username;
            document.getElementById('profileAvatar').textContent = firstLetter;
        });
    </script>
</body>
</html>
