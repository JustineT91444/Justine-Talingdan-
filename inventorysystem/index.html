<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory System</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <script>
        // Redirect to dashboard if authenticated, otherwise to login
        const username = localStorage.getItem('username');
        if (username) {
            window.location.href = 'dashboard.html';
        } else {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Fallback content in case JavaScript is disabled -->
    <div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
        <div>
            <h1>Inventory System</h1>
            <p>Redirecting...</p>
            <p><a href="login.html">Click here if not automatically redirected.</a></p>
        </div>
    </div>
</body>
</html>
